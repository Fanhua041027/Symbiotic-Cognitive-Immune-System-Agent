name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check
      - name: Verify app.py compiles
        run: python -c "import ast; ast.parse(open('app.py', encoding='utf-8').read()); print('app.py AST OK')"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install chromadb
      - name: Run tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m pytest tests/ -v --tb=short -x
        timeout-minutes: 5

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t immune-agent .
      - name: Verify container
        run: |
          docker run --rm immune-agent python -c "
          import sys; sys.path.insert(0, '.')
          from core.state import ImmunologyState
          from core.logger import setup_logger
          from core.config import validate_all
          from core.memory import memory_db
          print('Immune memory: %d antibodies' % memory_db.count())
          print('Container OK')
          "
