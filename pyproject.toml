[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "symbiotic-immune-agent"
dynamic = ["version"]
description = "Bio-inspired multi-agent defense framework with self-diagnosis, self-healing, and self-evolution capabilities"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.4.0",
    "langchain-openai>=0.3.0",
    "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
memory = ["chromadb>=0.6.0"]
webui = ["streamlit>=1.30.0"]
api = ["fastapi>=0.110.0", "uvicorn>=0.29.0"]
dev = ["pytest>=8.0", "pre-commit>=3.0", "ruff>=0.4"]
all = ["chromadb>=0.6.0", "streamlit>=1.30.0", "fastapi>=0.110.0", "uvicorn>=0.29.0", "pytest>=8.0", "pre-commit>=3.0", "ruff>=0.4"]

[project.urls]
Repository = "https://github.com/Fanhua041027/Symbiotic-Cognitive-Immune-System-Agent"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.setuptools.dynamic]
version = {attr = "core.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "Q", "COM"]

[tool.ruff.lint.per-file-ignores]
"api.py" = ["E402"]
"app.py" = ["E402", "E501", "E701", "E702"]
"core/nodes.py" = ["E501"]
"core/memory.py" = ["E501"]
"tests/test_core.py" = ["E501"]
"core/workflow.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
